---
# Optional: a small "welcome" .deb (e.g. one that just drops your
# sources.list snippet + signing key) seeded into every new "main"
# repository, so `apt install <that-package>` bootstraps the repo config.
# Skipped entirely when repo_seed_deb isn't set — see
# subtask/create-distro-repositories.yml.
- name: Prepare initial package
  ansible.builtin.copy:
    src: "{{ repo_seed_deb }}"
    dest: "/tmp/{{ repo_seed_deb }}"
    mode: "u+r"
  when: repo_seed_deb is defined

- name: Ensure base directory exists for {{ repo_user }}
  ansible.builtin.file:
    path: "/var/lib/{{ repo_user }}"
    state: directory
    mode: "0750"
    owner: "{{ repo_user }}"
    group: "{{ repo_user }}"
  become: true

- name: Ensure aptly home exists for {{ repo_user }}
  ansible.builtin.file:
    path: "/var/lib/{{ repo_user }}/.aptly"
    state: directory
    mode: "0750"
    owner: "{{ repo_user }}"
    group: "{{ repo_user }}"
  become: true

- name: Repos already present
  ansible.builtin.command: aptly repo list -raw
  register: repos_present_raw
  changed_when: false
  become_user: "{{ repo_user }}"
  environment:
    HOME: "/var/lib/{{ repo_user }}"

- name: Repos we got
  ansible.builtin.set_fact:
    repos_we_got: "{{ repos_present_raw.stdout_lines }}"

- name: Create Distribution endpoints
  ansible.builtin.include_tasks: "subtask/create-distro-endpoint.yml"
  loop: "{{ repos }}"
  loop_control:
    loop_var: distro_endpoints

- name: Repos already present
  ansible.builtin.command: "aptly repo list -raw"
  register: repos_present_raw
  changed_when: false
  become_user: "{{ repo_user }}"
  environment:
    HOME: "/var/lib/{{ repo_user }}"

- name: Aptly repo list
  ansible.builtin.set_fact:
    repos_we_got: "{{ repos_present_raw.stdout_lines }}"

- name: Print repos
  ansible.builtin.debug:
    var: repos_we_got
