---
- name: "What is my Distro family ?"
  ansible.builtin.set_fact:
    distro_family: "{{ lookup('dict', distro_families).key }}"

- name: "Create Distribution releases for {{ distro_family }}"
  ansible.builtin.include_tasks: 'subtask/snapshot-distro-release.yml'
  loop: "{{ lookup('dict', distro_families).value }}"
  loop_control:
    loop_var: distro_releases
