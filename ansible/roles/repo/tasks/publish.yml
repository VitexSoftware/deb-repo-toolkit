- name: Determine base URL for sources snippets
  ansible.builtin.set_fact:
    base_url: "{{ endpoint_base_urls[publish_endpoint] | default('http://' + repo_domain) }}"

- name: Export public GPG key (armored)
  ansible.builtin.command: "gpg --homedir /var/lib/{{ repo_user }}/.gnupg --export --armor"
  register: repo_pubkey
  changed_when: false
  become_user: "{{ repo_user }}"

- name: Write KEY.asc into publish root
  ansible.builtin.copy:
    dest: "{{ repo_public }}/KEY.asc"
    content: "{{ repo_pubkey.stdout }}\n"

- name: Export public GPG key (keyring)
  ansible.builtin.shell:
    cmd: "gpg --homedir /var/lib/{{ repo_user }}/.gnupg --export > {{ repo_public }}/KEY.gpg"
  args:
    executable: /bin/bash
    creates: "{{ repo_public }}/KEY.gpg"
  become_user: "{{ repo_user }}"

- name: Get Aptly repositories list (JSON)
  ansible.builtin.command: aptly repo -json list
  register: aptly_repo_list_json
  changed_when: false
  become_user: "{{ repo_user }}"

- name: Set aptly_repo_list fact
  ansible.builtin.set_fact:
    aptly_repo_list: "{{ aptly_repo_list_json.stdout | from_json }}"
  when: aptly_repo_list_json.stdout is defined

- name: Set generation metadata facts
  ansible.builtin.set_fact:
    generated_at: "{{ (ansible_date_time.iso8601 if (ansible_date_time is defined and 'iso8601' in ansible_date_time) else lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ')) }}"
    semaphore_task_id: "{{ lookup('env', 'SEMAPHORE_TASK_ID') | default('', true) }}"


