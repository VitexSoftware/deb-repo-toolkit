---
- name: Ensure gnupg and aptly are installed
  ansible.builtin.package:
    name:
      - gnupg
      - aptly
    state: present
  become: true
  become_user: root

- name: Ensure base directories exist for {{ repo_user }}
  ansible.builtin.file:
    path: "/var/lib/{{ repo_user }}"
    state: directory
    mode: "0750"
    owner: "{{ repo_user }}"
    group: "{{ repo_user }}"
  become: true
  become_user: root

- name: Ensure GnuPG home exists for {{ repo_user }}
  ansible.builtin.file:
    path: "/var/lib/{{ repo_user }}/.gnupg"
    state: directory
    mode: "0700"
    owner: "{{ repo_user }}"
    group: "{{ repo_user }}"
  become: true
  become_user: root

- name: Derive publish endpoint name from repos list
  ansible.builtin.set_fact:
    publish_endpoint: "{{ (repos | first) | dict2items | first | json_query('key') }}"

- name: Ensure publish parent dir exists
  ansible.builtin.file:
    path: "{{ repo_public | dirname }}"
    state: directory
    mode: "0755"
  become: true
  become_user: root

- name: Ensure publish rootDir exists
  ansible.builtin.file:
    path: "{{ repo_public }}"
    state: directory
    mode: "0755"
    owner: "{{ repo_user }}"
    group: "{{ repo_user }}"
  become: true
  become_user: root

- name: Configure aptly with proper settings
  ansible.builtin.template:
    src: aptly.conf.j2
    dest: "/etc/aptly.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  become_user: root

- name: Create symlink from user aptly config to system config
  ansible.builtin.file:
    src: "/etc/aptly.conf"
    dest: "/var/lib/{{ repo_user }}/.aptly.conf"
    state: link
    owner: "{{ repo_user }}"
    group: "{{ repo_user }}"
  become: true
  become_user: root

