- name: Ensure passphrase file exists
  ansible.builtin.copy:
    dest: "{{ passphrasefile }}"
    content: ""
    owner: "{{ repo_user }}"
    group: "{{ repo_user }}"
    mode: "0600"
    force: false
  become: true
  become_user: root

- name: Check if secret key exists
  ansible.builtin.command: "gpg --homedir /var/lib/{{ repo_user }}/.gnupg --list-secret-keys --with-colons"
  register: gpg_keys
  changed_when: false
  failed_when: false

- name: Generate GPG key for {{ repo_user }} when missing
  when: "'sec:' not in gpg_keys.stdout"
  block:
    - name: Create GPG batch file
      ansible.builtin.copy:
        dest: "/var/lib/{{ repo_user }}/.gnupg/gpg-batch"
        owner: "{{ repo_user }}"
        group: "{{ repo_user }}"
        mode: "0600"
        content: |
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Name-Real: "{{ repo_name }} ({{ repo_user }})"
          Name-Email: {{ repo_admin_email }}
          Expire-Date: 0
          %commit
      become: true
      become_user: root
    - name: Generate key
      ansible.builtin.command: "gpg --homedir /var/lib/{{ repo_user }}/.gnupg --batch --generate-key /var/lib/{{ repo_user }}/.gnupg/gpg-batch"
      become: true
      become_user: root
      changed_when: true

- name: Determine repo key fingerprint
  ansible.builtin.command: "gpg --homedir /var/lib/{{ repo_user }}/.gnupg --list-secret-keys --with-colons"
  register: gpg_list
  changed_when: false

- name: Set repo_key fact
  ansible.builtin.set_fact:
    repo_key: "{{ (gpg_list.stdout_lines | select('match', '^fpr:') | list | first | split(':'))[9] }}"

- name: Refresh GPG key self-signature to SHA256 (fixes sqv rejection of SHA1 binding on Debian trixie+)
  ansible.builtin.command: >
    gpg --homedir /var/lib/{{ repo_user }}/.gnupg
    --passphrase-file {{ passphrasefile }}
    --pinentry-mode loopback
    --cert-digest-algo SHA256
    --quick-update-pref {{ repo_key }}
  become: true
  become_user: "{{ repo_user }}"
  changed_when: false
  failed_when: false

- name: Check already Published
  ansible.builtin.shell:
    cmd: "aptly publish -raw list | awk ' { t = $1; $1 = $2; $2 = t; print; } '"
  register: published_raw
  changed_when: published_raw.rc != 0
  ignore_errors: true

- name: Use published list as fact
  ansible.builtin.set_fact:
    published: "{{ published_raw.stdout_lines if published_raw.stdout_lines is iterable else [] }}"

- name: Published yet
  ansible.builtin.debug:
    var: published

- name: Repos already present
  ansible.builtin.command: "aptly repo list -raw"
  register: repos_present_raw
  changed_when: false

- name: Check todays Snapshots
  ansible.builtin.shell:
    cmd: "aptly snapshot -raw list | grep  {{ today }}"
  register: snapshots_raw
  changed_when: snapshots_raw.rc != 0
  ignore_errors: true

- name: Repos we got
  ansible.builtin.set_fact:
    repos_we_got: "{{ repos_present_raw.stdout_lines }}"
    snapshots_today: "{{ snapshots_raw.stdout_lines }}"

- name: Remove old dists from aptly endpoint directory
  ansible.builtin.file:
    path: "{{ repo_home }}/public/{{ publish_endpoint }}/dists"
    state: absent
  become: true
  become_user: root
  when: publish_endpoint is defined
  ignore_errors: true

- name: Remove old pool from aptly endpoint directory
  ansible.builtin.file:
    path: "{{ repo_home }}/public/{{ publish_endpoint }}/pool"
    state: absent
  become: true
  become_user: root
  when: publish_endpoint is defined
  ignore_errors: true

- name: Capture pre-publish package baseline for Mastodon announcement diff
  ansible.builtin.shell:
    cmd: |
      metadata_dir="{{ repo_home }}/.snapshot-metadata"
      mkdir -p "$metadata_dir"
      today=$(date +%Y-%m-%d)
      # Archive only files from previous runs (not today's) as the baseline.
      # Today's files were just created by the snapshot step and must remain
      # so post-to-mastodon can diff them against *_previous.json.
      find "$metadata_dir" -maxdepth 1 -name "*.json" \
        -not -name "*_previous.json" \
        -not -name "*_${today}.json" \
        -type f 2>/dev/null |
      while IFS= read -r f; do
        newfile="${f%_*.json}_previous.json"
        mv -f "$f" "$newfile"
        echo "Baseline: $(basename $f)"
      done
    executable: /bin/bash
  become_user: "{{ repo_user }}"
  changed_when: false
  failed_when: false

- name: Publish todays Snapshots
  ansible.builtin.include_tasks: "subtask/publish-distro-endpoint.yml"
  loop: "{{ repos }}"
  loop_control:
    loop_var: distro_endpoints

# - name: Update Repo graph
