# /var/lib/multirepo/.aptly/public/multiflexi/dists
# /var/lib/multirepo/public/multiflexi

- name: Ensure web root directory exists
  ansible.builtin.file:
    path: "{{ repo_public }}"
    state: directory
    mode: "0755"
    owner: "{{ repo_user }}"
    group: "www-data"
  become: true
  become_user: root

- name: Remove old dists if it's a directory (not a symlink)
  ansible.builtin.file:
    path: "{{ repo_public }}/dists"
    state: absent
  become: true
  become_user: root
  when: repo_public is defined and repo_public != (repo_home + '/public/' + publish_endpoint)
  ignore_errors: true

- name: Remove old pool if it's a directory (not a symlink)
  ansible.builtin.file:
    path: "{{ repo_public }}/pool"
    state: absent
  become: true
  become_user: root
  when: repo_public is defined and repo_public != (repo_home + '/public/' + publish_endpoint)
  ignore_errors: true

- name: Ensure dists symlink is on website server
  ansible.builtin.file:
    path: "{{ repo_public }}/dists"
    state: link
    src: "{{ repo_home }}/public/{{ publish_endpoint }}/dists"
  become: true
  become_user: root
  when: repo_public != (repo_home + '/public/' + publish_endpoint)

- name: Ensure pool symlink is on website server
  ansible.builtin.file:
    path: "{{ repo_public }}/pool"
    state: link
    src: "{{ repo_home }}/public/{{ publish_endpoint }}/pool"
  become: true
  become_user: root
  when: repo_public != (repo_home + '/public/' + publish_endpoint)

- name: Ensure media symlink is on website server (for DEP-11)
  ansible.builtin.file:
    path: "{{ repo_public }}/media"
    state: link
    src: "{{ repo_home }}/public/{{ publish_endpoint }}/media"
  become: true
  become_user: root
  when: repo_public != (repo_home + '/public/' + publish_endpoint)

- name: Copy repository logo to public directory
  ansible.builtin.copy:
    src: "{{ repo_logo }}"
    dest: "{{ repo_public }}/repo-logo{{ repo_logo | splitext | last }}"
    owner: "{{ repo_user }}"
    group: "www-data"
    mode: "0644"
  become: true
  become_user: root
  when: repo_logo is defined

- name: Copy repository badge to public directory
  ansible.builtin.copy:
    src: "{{ repo_badge }}"
    dest: "{{ repo_public }}/repo-badge{{ repo_badge | splitext | last }}"
    owner: "{{ repo_user }}"
    group: "www-data"
    mode: "0644"
  become: true
  become_user: root
  when: repo_badge is defined

- name: Ensure repository parent directories are traversable by web server
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "o+x"
  loop:
    - "/var/lib/{{ repo_user }}"
    - "{{ repo_home | dirname }}"
  become: true
  become_user: root
  when: repo_home is search('/var/lib/')

- name: Ensure public domain directory exists
  ansible.builtin.file:
    path: "/var/www/html/{{ repo_domain }}"
    state: directory
    mode: "0755"
    owner: "{{ repo_user }}"
    group: "www-data"
  become: true
  become_user: root
  when: repo_domain is defined and repo_domain != (repo_public | basename)

- name: Build list of files to sync
  ansible.builtin.set_fact:
    sync_files: >-
      {{ ['index.html', 'README.html', 'KEY.asc', 'KEY.gpg', 'repo.css', 'repo.js', 'placeholder.svg']
         + (['repo-logo' + (repo_logo | splitext | last)] if repo_logo is defined else [])
         + (['repo-badge' + (repo_badge | splitext | last)] if repo_badge is defined else []) }}

- name: Sync HTML files and logo to public domain
  ansible.builtin.copy:
    src: "{{ repo_public }}/{{ item }}"
    dest: "/var/www/html/{{ repo_domain }}/{{ item }}"
    remote_src: yes
    owner: "{{ repo_user }}"
    group: "www-data"
    mode: "0644"
  loop: "{{ sync_files }}"
  become: true
  become_user: root
  when: repo_domain is defined and repo_domain != (repo_public | basename)
  ignore_errors: yes

# Optional: syncs package metadata into a MySQL database via the debs2sql
# tool, for sites that build their own search/browse UI on top of a DB
# instead of (or alongside) the generated README/index.html. Most setups
# don't need this — leave debs2sql_enabled unset.
- name: Sync package metadata into a database via debs2sql
  when: debs2sql_enabled | default(false)
  block:
    - name: Ensure debs2sql is installed
      ansible.builtin.package:
        name: debs2sql
        state: present
      become: true
      become_user: root
      delegate_to: "{{ debs2sql_host | default('localhost') }}"

    - name: Ensure debs2sql config directory exists
      ansible.builtin.file:
        path: "/etc/debs2sql"
        state: directory
        mode: "0755"
      become: true
      become_user: root
      delegate_to: "{{ debs2sql_host | default('localhost') }}"

    - name: Configure debs2sql for website integration
      ansible.builtin.copy:
        dest: "/etc/debs2sql/.env"
        mode: "0644"
        content: |
          APP_DEBUG=false
          EASE_LOGGER=syslog
          DB_CONNECTION=mysql
          DB_HOST={{ debs2sql_db_host | default('127.0.0.1') }}
          DB_PORT={{ debs2sql_db_port | default('3306') }}
          DB_DATABASE={{ debs2sql_db_name }}
          DB_USERNAME={{ debs2sql_db_user | default('debs2sql') }}
          DB_PASSWORD={{ debs2sql_db_password }}
          EMAIL_FROM={{ debs2sql_email_from | default('debs2sql@' + repo_domain) }}
          SEND_INFO_TO={{ repo_admin_email }}
          REPO_DIR={{ repo_public | dirname }}
      become: true
      become_user: root
      delegate_to: "{{ debs2sql_host | default('localhost') }}"

    - name: Update package database with debs2sql
      ansible.builtin.command: "/usr/bin/debs2sql"
      register: debs2sql_result
      changed_when: debs2sql_result.rc == 0
      failed_when: false
      become: true
      become_user: "{{ repo_user }}"
      delegate_to: "{{ debs2sql_host | default('localhost') }}"

    - name: Display debs2sql result
      ansible.builtin.debug:
        var: debs2sql_result

- name: Set up toot for Mastodon announcements
  ansible.builtin.include_tasks: "subtask/setup-toot.yml"

- name: Post repository update to Mastodon
  ansible.builtin.include_tasks: "subtask/post-to-mastodon.yml"

# Automatic repository synchronization to website server
# Optional: only needed if you build/publish the repo on one host (e.g. a CI
# runner) and serve it from a separate public-facing web host. Most setups
# publish directly on the web host and can leave sync_to_website_enabled unset.
- name: Setup automated repository sync from build host to website
  when: sync_to_website_enabled | default(false)
  block:
    - name: Create log file for repository sync
      ansible.builtin.file:
        path: /var/log/repo-sync.log
        state: touch
        mode: '0664'
        owner: "{{ sync_dest_user }}"
        group: "{{ sync_dest_user }}"
      become: true
      become_user: root
      delegate_to: "{{ sync_dest_host }}"

    - name: Deploy sync script to {{ sync_dest_host }}
      ansible.builtin.template:
        src: sync-repo-to-website.sh.j2
        dest: /usr/local/bin/sync-repo-to-website.sh
        mode: '0755'
        owner: "{{ sync_dest_user }}"
        group: "{{ sync_dest_user }}"
      become: true
      become_user: root
      delegate_to: "{{ sync_dest_host }}"

    - name: Deploy systemd service file
      ansible.builtin.copy:
        src: sync-repo-to-website.service
        dest: /etc/systemd/system/sync-repo-to-website.service
        mode: '0644'
      become: true
      become_user: root
      delegate_to: "{{ sync_dest_host }}"

    - name: Deploy systemd timer file
      ansible.builtin.copy:
        src: sync-repo-to-website.timer
        dest: /etc/systemd/system/sync-repo-to-website.timer
        mode: '0644'
      become: true
      become_user: root
      delegate_to: "{{ sync_dest_host }}"

    - name: Reload systemd daemon on {{ sync_dest_host }}
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      become_user: root
      delegate_to: "{{ sync_dest_host }}"

    - name: Enable and start sync timer
      ansible.builtin.systemd:
        name: sync-repo-to-website.timer
        enabled: true
        state: started
      become: true
      become_user: root
      delegate_to: "{{ sync_dest_host }}"

    - name: Display timer status
      ansible.builtin.command:
        cmd: systemctl status sync-repo-to-website.timer --no-pager
      register: timer_status
      changed_when: false
      delegate_to: "{{ sync_dest_host }}"
      ignore_errors: true

    - name: Display sync timer information
      ansible.builtin.debug:
        msg: "Repository sync timer has been configured to run automatically every 1 hour"
