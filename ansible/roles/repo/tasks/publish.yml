- name: Set fact for distro list (for DEP-11)
  ansible.builtin.set_fact:
    distro_list: >-
      {{ aptly_repo_list | map(attribute='DefaultDistribution') | list | unique | sort
         | reject('in', hidden_distros | default([])) | list }}

# Build distribution-component mapping early so the DEP-11 copy loop is dynamic
- name: Build distribution-component mapping
  ansible.builtin.set_fact:
    distro_components: >-
      {%- set result = {} -%}
      {%- for endpoint in repos -%}
        {%- for ep_name, families in endpoint.items() -%}
          {%- if ep_name == publish_endpoint -%}
            {%- for family in families -%}
              {%- for family_name, suites in family.items() -%}
                {%- for suite_obj in suites -%}
                  {%- for suite_name, comps in suite_obj.items() -%}
                    {%- set components = ['main'] -%}
                    {%- if comps is iterable and comps is not string -%}
                      {%- set _ = components.extend(comps) -%}
                    {%- endif -%}
                    {%- set _ = result.update({suite_name: components}) -%}
                  {%- endfor -%}
                {%- endfor -%}
              {%- endfor -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ result }}

- name: Generate DEP-11 metadata
  ansible.builtin.include_tasks: "subtask/generate-dep11.yml"

- name: Deploy DEP-11 description extractor script
  ansible.builtin.copy:
    src: extract-dep11-descriptions.py
    dest: "{{ repo_home }}/extract-dep11-descriptions.py"
    owner: "{{ repo_user }}"
    group: "{{ repo_user }}"
    mode: "0755"
  become: true
  become_user: root

# Reuses the DEP-11 metadata already generated for /imgdeb icons — no extra
# per-package aptly queries needed to populate the package browser popup.
- name: Extract package descriptions from DEP-11 metadata
  ansible.builtin.command:
    cmd: "python3 {{ repo_home }}/extract-dep11-descriptions.py {{ repo_home }}/asgen/export/data"
  register: dep11_descriptions_result
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ repo_user }}"

- name: Set fact for package descriptions
  ansible.builtin.set_fact:
    package_descriptions: >-
      {{ (dep11_descriptions_result.stdout | from_json)
         if (dep11_descriptions_result.rc == 0 and dep11_descriptions_result.stdout | trim | length > 0)
         else {} }}

- name: Copy DEP-11 metadata to published repository
  block:
    - name: Copy DEP-11 data for each distribution/component
      ansible.builtin.shell: |
        for dist in {{ distro_list | join(' ') }}; do
          for comp in {{ distro_components.values() | flatten | unique | join(' ') }}; do
            src_dir="{{ repo_home }}/asgen/export/data/${dist}/${comp}"
            dest_dir="{{ repo_home }}/public/{{ publish_endpoint }}/dists/${dist}/${comp}/dep11"
            if [ -d "${src_dir}" ]; then
              echo "Copying DEP-11 metadata: ${dist}/${comp}"
              mkdir -p "${dest_dir}"
              cp -r "${src_dir}/"* "${dest_dir}/"
            else
              echo "No DEP-11 metadata for ${dist}/${comp}"
            fi
          done
        done
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ repo_user }}"

    - name: Copy DEP-11 media (icons, screenshots)
      ansible.builtin.shell: |
        media_src="{{ repo_home }}/asgen/export/media"
        media_dest="{{ repo_home }}/public/{{ publish_endpoint }}"
        if [ -d "${media_src}" ]; then
          echo "Copying DEP-11 media files"
          rsync -av --delete "${media_src}/" "${media_dest}/media/"
        fi
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ repo_user }}"

    - name: Ensure flat imgdeb icon directory exists at web root
      ansible.builtin.file:
        path: "{{ repo_public }}/imgdeb"
        state: directory
        mode: "0755"
        owner: "{{ repo_user }}"
        group: "www-data"
      become: true
      become_user: root

    - name: Flatten AppStream icons into imgdeb for /imgdeb/<pkgname>.png serving
      ansible.builtin.shell: |
        MEDIA_DIR="{{ repo_home }}/asgen/export/media"
        IMGDEB_DIR="{{ repo_public }}/imgdeb"
        # Remove stale symlinks with broken double-.png.png names from old regex
        find "$IMGDEB_DIR" -name '*.png.png' -type l -delete 2>/dev/null || true
        find "$MEDIA_DIR" -path "*/icons/64x64/*.png" 2>/dev/null | while IFS= read -r icon; do
          pkgname=$(basename "$icon" | sed 's/_[a-f0-9]\{8,\}\.png$//;s/_.*//')
          [ -n "$pkgname" ] && ln -sf "$icon" "${IMGDEB_DIR}/${pkgname}.png"
        done
        echo "imgdeb: $(ls -1 "$IMGDEB_DIR" 2>/dev/null | wc -l) icons"
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ repo_user }}"
      register: imgdeb_result
      changed_when: true
      failed_when: false

    - name: Show imgdeb icon count
      ansible.builtin.debug:
        var: imgdeb_result.stdout

- name: Re-sign InRelease files to include dep11 hashes
  ansible.builtin.include_tasks: "subtask/resign-with-dep11.yml"

- name: Published
  ansible.builtin.command:
    cmd: "aptly publish -raw list"
  register: published_raw
  changed_when: published_raw.rc != 0

- name: "All Published yet"
  ansible.builtin.debug:
    var: published_raw

# Build flat list of distro-component pairs to query (all components, not just main)
- name: Build distro-component query list
  ansible.builtin.set_fact:
    distro_component_pairs: >-
      {%- set pairs = [] -%}
      {%- for distro, components in distro_components.items() -%}
        {%- for comp in components -%}
          {%- set _ = pairs.append({"distro": distro, "component": comp}) -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ pairs }}

# Get package lists for all distro-component combinations
- name: Get package list for each distro-component (JSON)
  ansible.builtin.command: "aptly repo show -with-packages -json {{ item.distro }}-{{ item.component }}-{{ publish_endpoint }}"
  register: repo_packages_json
  loop: "{{ distro_component_pairs }}"
  changed_when: false
  failed_when: false

# Initialise empty dict so the accumulation loop has a base value
- name: Initialize package_links
  ansible.builtin.set_fact:
    package_links: {}

# Accumulate package entries (name + component) per distro
- name: Set fact for package links with component info
  ansible.builtin.set_fact:
    package_links: >-
      {%- set distro = item.item.distro -%}
      {%- set comp = item.item.component -%}
      {%- set pkgs = (item.stdout | from_json).Packages | default([]) -%}
      {%- set tagged = [] -%}
      {%- for pkg in pkgs -%}
        {%- set _ = tagged.append({"name": pkg, "component": comp, "description": package_descriptions.get(pkg.split('_')[0], '')}) -%}
      {%- endfor -%}
      {{ package_links | combine({distro: package_links.get(distro, []) + tagged}) }}
  loop: "{{ repo_packages_json.results }}"
  when: item.rc is defined and item.rc == 0 and item.stdout is defined and item.stdout | length > 0

- name: Remove hidden distros from package_links
  ansible.builtin.set_fact:
    package_links: >-
      {{ package_links | dict2items
         | rejectattr('key', 'in', hidden_distros | default([]))
         | items2dict }}

# Generate README.html with Bootstrap 5 multi-level tabs for distro organization
- name: Generate Bootstrap 5 README.html
  ansible.builtin.template:
    src: README-bootstrap5.html.j2
    dest: "{{ repo_public }}/README.html"
    owner: "{{ repo_user }}"
    group: "{{ repo_user }}"
    mode: "0644"

  # Generate INDEX.html with Bootstrap 5 (same as README.html)
- name: Generate INDEX.html with Bootstrap 5 search functionality
  ansible.builtin.template:
    src: README-bootstrap5.html.j2
    dest: "{{ repo_public }}/index.html"
    owner: "{{ repo_user }}"
    group: "{{ repo_user }}"
    mode: "0644"

- name: Deploy repo.css static stylesheet
  ansible.builtin.copy:
    src: repo.css
    dest: "{{ repo_public }}/repo.css"
    owner: "{{ repo_user }}"
    group: "www-data"
    mode: "0644"
  become: true
  become_user: root

- name: Deploy repo.js static script
  ansible.builtin.copy:
    src: repo.js
    dest: "{{ repo_public }}/repo.js"
    owner: "{{ repo_user }}"
    group: "www-data"
    mode: "0644"
  become: true
  become_user: root

- name: Deploy placeholder.svg for packages without an AppStream icon
  ansible.builtin.copy:
    src: placeholder.svg
    dest: "{{ repo_public }}/placeholder.svg"
    owner: "{{ repo_user }}"
    group: "www-data"
    mode: "0644"
  become: true
  become_user: root

